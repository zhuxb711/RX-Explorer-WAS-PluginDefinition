name: Publish Artifacts

on:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  Publish:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      packages: write
    env:
      Env_Configuration: Release
      Env_SolutionPath: ${{github.workspace}}/RX-Explorer-WAS-PluginDefinition.slnx
      Env_PublishOutputPath: ${{github.workspace}}/Output

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Install Latest .NET 10 SDK
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 10.x

      - name: Build Plugin Definition Artifacts
        shell: pwsh
        run: |
          dotnet pack "${{env.Env_SolutionPath}}" `
            --verbosity normal `
            --output "${{env.Env_PublishOutputPath}}" `
            --configuration "${{env.Env_Configuration}}" `
            --property:ContinuousIntegrationBuild=true

      - name: Publish to GitHub Packages
        shell: pwsh
        run: |
          $nupkgFiles = Get-ChildItem -Path "${{env.Env_PublishOutputPath}}" -Filter "*.nupkg"

          foreach ($file in $nupkgFiles) {
            Write-Host "Publishing package `"$($file.Name)`""

            dotnet nuget push "$($file.FullName)" --source "github" --api-key "${{secrets.GITHUB_TOKEN}}"

            if ($LASTEXITCODE -eq 0) {
              Write-Host "Package `"$($file.Name)`" published successfully."
            } else {
              Write-Error "Failed to publish package `"$($file.Name)`""
              exit $LASTEXITCODE
            }
          }

          Write-Host "All packages have been published successfully."

      - name: Reserve Space And Cleanup Outdated Artifacts
        uses: zhuxb711/artifacts-size-based-cleanup-action@v1.2.1
        with:
          limit: 1.5GB
          failOnError: true
          removeDirection: oldest
          simulateCompressionLevel: 9
          artifactPaths: ${{env.Env_PublishOutputPath}}

      - name: Upload Plugin Definition Artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: Plugin Definition Artifacts
          compression-level: 9
          if-no-files-found: error
          path: ${{env.Env_PublishOutputPath}}
