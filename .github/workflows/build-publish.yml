name: RX-Explorer-WAS-PluginDefinition Publish

on:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  PluginDefinitionNugetBuild:
    runs-on: windows-latest
    env:
      Env_Configuration: Release
      Env_ProjectName: RX-Explorer-WAS-PluginDefinition
      Env_BuildToolArchitecture: x64
      Env_SolutionPath: ${{github.workspace}}\RX-Explorer-WAS-PluginDefinition.slnx
      Env_PublishOutputPath: ${{github.workspace}}\Output

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Latest .NET 9 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x

      - name: Install Latest MSBuild Workload
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Create PublishOutput folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ${{env.Env_PublishOutputPath}}

      - name: Build Plugin Definition Artifacts
        shell: pwsh
        run: |
            msbuild "${{env.Env_SolutionPath}}" `
              /m `
              /nr:false `
              /restore `
              /t:Clean,${{env.Env_ProjectName}}:Pack `
              /p:PreferredToolArchitecture="${{env.Env_BuildToolArchitecture}}" `
              /p:Configuration="${{env.Env_Configuration}}" `
              /p:PackageOutputPath="${{env.Env_PublishOutputPath}}\"

      - name: Remove Old Artifacts
        uses: c-hive/gha-remove-artifacts@v1.4.0
        with:
          age: 0 seconds
          skip-recent: 5
          skip-tags: false

      - name: Upload Plugin Definition Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plugin Definition Artifacts
          compression-level: 9
          if-no-files-found: error
          path: ${{env.Env_PublishOutputPath}}
