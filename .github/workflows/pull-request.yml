name: Build PR Artifacts

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number}}
  cancel-in-progress: true

jobs:
  PRBuild:
    runs-on: windows-latest
    env:
      Env_Configuration: Release
      Env_BuildToolArchitecture: x64
      Env_SolutionPath: ${{github.workspace}}\RX-Explorer-WAS-PluginDefinition.slnx

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.1

      - name: Install Latest .NET 9 SDK
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: 9.x

      - name: Install Latest MSBuild Workload
        uses: microsoft/setup-msbuild@v2.0.0
        with:
          msbuild-architecture: x64

      - name: Build Plugin Definition Artifacts
        shell: pwsh
        run: |
          msbuild "${{env.Env_SolutionPath}}" `
            /m `
            /nr:false `
            /restore `
            /t:Clean,Build `
            /p:Configuration="${{env.Env_Configuration}}" `
            /p:PreferredToolArchitecture="${{env.Env_BuildToolArchitecture}}" `
