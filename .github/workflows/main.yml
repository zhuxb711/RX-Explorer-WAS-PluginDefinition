name: RX-Explorer-WAS-PluginDefinition CI/CD Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  SideloadBuild:
    runs-on: windows-latest
    env:
      Configuration: Release
      ProjectName: RX-Explorer-WAS-PluginDefinition
      SolutionPath: ${{github.workspace}}\RX-Explorer-WAS-PluginDefinition.sln
      PublishOutputPath: ${{github.workspace}}\Output
      PackageOutputPath: ${{github.workspace}}\Output\Package
      NUGET_RESTORE_MSBUILD_ARGS: /p:Configuration=Release

    steps:
      - name: Checkout
        uses: actions/checkout@v3.6.0
        with:
          fetch-depth: 0

      - name: Install .NET Sdk
        uses: actions/setup-dotnet@v3.2.0
        with:
          dotnet-version: 7.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.3.1
        with:
          msbuild-architecture: x64

      - name: Setup NuGet.exe
        uses: NuGet/setup-nuget@v1.2.0
        with:
          nuget-version: latest

      - name: Create PublishOutput And PackageOutput folder
        run: |
          New-Item -ItemType Directory -Path $env:PublishOutputPath

      - name: Restore the solution
        run: nuget restore $env:SolutionPath

      - name: Create the PluginDllResolver package
        run: msbuild $env:SolutionPath /t:${{env.ProjectName}}:Pack /nologo /nr:false /t:Clean /p:Configuration=$env:Configuration /p:PublishOutputPath=${{env.PublishOutputPath}}\ /p:PackageOutputPath=${{env.PackageOutputPath}}\

      - name: Cleanup redundant files
        run: Remove-Item -Path $env:PackageOutputPath -Recurse

      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1.3.0
        with:
          age: 0 seconds
          skip-recent: 5
          skip-tags: false

      - name: Upload RX-Explorer-WAS-PluginDefinition artifacts
        uses: actions/upload-artifact@v3.1.2
        with:
          name: Plugin Definition Nuget Artifacts
          path: ${{env.PublishOutputPath}}
