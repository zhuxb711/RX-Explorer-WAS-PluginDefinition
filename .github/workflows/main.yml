name: RX-Explorer-WAS-PluginDefinition CI/CD Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  PluginDefinitionNugetBuild:
    runs-on: windows-latest
    env:
      Configuration: Release
      ProjectName: RX-Explorer-WAS-PluginDefinition
      SolutionPath: ${{github.workspace}}\RX-Explorer-WAS-PluginDefinition.sln
      PublishOutputPath: ${{github.workspace}}\Output

    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0

      - name: Install .NET Sdk
        uses: actions/setup-dotnet@v4.0.0
        with:
          dotnet-version: 7.x

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v1.3.1
        with:
          msbuild-architecture: x64

      - name: Setup NuGet.exe
        uses: NuGet/setup-nuget@v1.2.0
        with:
          nuget-version: latest

      - name: Create PublishOutput folder
        run: |
          New-Item -ItemType Directory -Path ${{env.PublishOutputPath}}

      - name: Restore the solution
        run: nuget restore ${{env.SolutionPath}}

      - name: Create the nuget package
        run: msbuild ${{env.SolutionPath}} /t:${{env.ProjectName}}:Pack /nologo /nr:false /t:Clean /p:Configuration=${{env.Configuration}} /p:PackageOutputPath=${{env.PublishOutputPath}}\

      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1.3.0
        with:
          age: 0 seconds
          skip-recent: 5
          skip-tags: false

      - name: Upload Plugin Definition artifacts
        uses: actions/upload-artifact@v3.1.3
        with:
          name: Plugin Definition Artifacts
          path: ${{env.PublishOutputPath}}
